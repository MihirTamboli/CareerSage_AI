<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — CareerSage AI</title>
  <meta name="description" content="Register for CareerSage AI and begin your Class 10–12 career guidance assessment.">
  <link rel="stylesheet" href="css/app.css">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
</head>
<body>
  <div class="page">
    <div class="grid-bg"></div>
    <nav class="navbar"></nav>

    <main class="container">
      <div class="card form-card">
        <span class="pill">Student Registration</span>
        <h2>Create your CareerSage AI profile</h2>
        <p style="color:var(--ink-1);">We do not collect personal data. You’ll get a unique student code for login.</p>

        <form id="registerForm">
          <div class="form-group">
            <label class="form-label" for="classLevel">Class Level</label>
            <select class="form-select" id="classLevel" required>
              <option value="">Select your class</option>
              <option value="10">Class 10</option>
              <option value="11">Class 11</option>
              <option value="12">Class 12</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="boardType">Education Board</label>
            <select class="form-select" id="boardType" required>
              <option value="CBSE">CBSE</option>
              <option value="ICSE">ICSE</option>
              <option value="State">State Board</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1.5rem;">
            Create Account
          </button>
        </form>
      </div>
    </main>

    <div id="successModal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <div class="modal-icon success">✓</div>
        <h2 class="modal-title">Account Created!</h2>
        <p style="color: rgba(255,255,255,0.6);">Your unique student code is:</p>
        <div class="code-display" id="studentCode"></div>
        <p class="modal-hint">Save this code for future login</p>
        <button id="continueBtn" class="btn btn-primary" style="width:100%;">Continue to Dashboard</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const classLevel = document.getElementById('classLevel').value;
      const boardType = document.getElementById('boardType').value;

      try {
        const studentResponse = await Api.register({ class_level: classLevel, board_type: boardType });
        if (!studentResponse.success || !studentResponse.data || !studentResponse.data.success) {
          throw new Error(studentResponse.message || 'Registration failed');
        }

        const studentId = studentResponse.data.student_id;
        const uniqueCode = studentResponse.data.unique_code;

        Utils.setSession({
          student_id: studentId,
          unique_code: uniqueCode,
          class_level: classLevel,
          board_type: boardType
        });

        document.getElementById('studentCode').textContent = uniqueCode;
        document.getElementById('successModal').style.display = 'flex';
      } catch (error) {
        Utils.showAlert(error.message, 'error');
      }
    });

    document.getElementById('continueBtn').addEventListener('click', () => {
      window.location.href = 'aptitude-test.html';
    });
  </script>
</body>
</html>
